name: Docker Publish

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/*.yml"
      - "**/LICENSE"
      - "**/*.md"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.png"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[skip ci]') == false)
    uses: ./.github/workflows/validate.yml

  docker:
    needs: test
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[skip ci]') == false)
    runs-on: [self-hosted, Linux, X64]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set image name
        id: image
        shell: bash
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          IMAGE="ghcr.io/${REPO}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Using image: ${IMAGE}"

      - name: Set image tag
        id: version
        shell: bash
        run: |
          BASE_TAG="v$(date -u +'%y.%m.%d')"
          TAG="$BASE_TAG"
          COUNT=0

          git fetch --tags --force

          while git rev-parse "$TAG" >/dev/null 2>&1; do
            COUNT=$((COUNT + 1))
            TAG="${BASE_TAG}-${COUNT}"
          done

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            COMMIT=${{ steps.version.outputs.commit }}
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Pastebox
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}

      - name: Create git tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]{2}[.][0-9]{2}[.][0-9]{2}(-[1-9][0-9]*)?$ ]] || exit 1
          test -n "$WORKFLOW_TOKEN"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "$TAG"
          # Keep workflow-write authentication limited to this push, without storing it.
          git -c credential.helper= \
            -c 'credential.helper=!f() { if [ "$1" = get ]; then printf "%s\n" "username=x-access-token" "password=$WORKFLOW_TOKEN"; fi; }; f' \
            push origin "refs/tags/$TAG"
