name: Docker Publish

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/*.yml"
      - "**/LICENSE"
      - "**/*.md"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.png"
  workflow_dispatch:

jobs:
  docker:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[skip actions]') == false
    runs-on: [self-hosted, Linux, X64]

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set image name
        id: image
        shell: bash
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          IMAGE="ghcr.io/${REPO}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Using image: ${IMAGE}"

      - name: Set image tag
        id: version
        shell: bash
        run: |
          BASE_TAG="v$(date -u +'%y.%m.%d')"
          TAG="$BASE_TAG"
          COUNT=0

          git fetch --tags --force

          while git rev-parse "$TAG" >/dev/null 2>&1; do
            COUNT=$((COUNT + 1))
            TAG="${BASE_TAG}-${COUNT}"
          done

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            COMMIT=${{ steps.version.outputs.commit }}
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Pastebox
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}

      - name: Create git tag
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "$TAG"
          git push origin "$TAG"
