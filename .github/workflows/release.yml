name: Release

on:
  workflow_run:
    workflows:
      - Docker Publish
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.conclusion == 'success' &&
      contains(github.event.workflow_run.head_commit.message, '[skip ci]') == false)
    runs-on: [self-hosted, Linux, X64]

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          git fetch --tags --force

          TAG_PATTERN='^v[0-9]{2}[.][0-9]{2}[.][0-9]{2}(-[1-9][0-9]*)?$'
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$(git tag --sort=-v:refname | awk -v pattern="$TAG_PATTERN" '$0 ~ pattern && !found { print; found=1 }')"
          else
            [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            TAG="$(git tag --points-at "$RELEASE_SHA" --sort=-v:refname | awk -v pattern="$TAG_PATTERN" '$0 ~ pattern && !found { print; found=1 }')"
          fi

          if [ -z "$TAG" ]; then
            echo "No release tag found." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Generate release notes
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]{2}[.][0-9]{2}[.][0-9]{2}(-[1-9][0-9]*)?$ ]] || exit 1
          REPO="${GITHUB_REPOSITORY,,}"
          IMAGE="ghcr.io/${REPO}"

          {
            echo "## Container Images"
            echo
            echo "- \`${IMAGE}:latest\`"
            echo "- \`${IMAGE}:${TAG}\`"
            echo
            echo "## Supported Platforms"
            echo
            echo "- linux/amd64"
            echo "- linux/arm64"
            echo
            echo "## Changes"
            echo
            PREVIOUS_TAG="$(git tag --sort=-v:refname | awk -v tag="$TAG" '$0 ~ /^v[0-9]{2}[.][0-9]{2}[.][0-9]{2}(-[1-9][0-9]*)?$/ && $0 != tag && !found { print; found=1 }')"
            if [ -n "$PREVIOUS_TAG" ]; then
              git log "${PREVIOUS_TAG}..${TAG}" --pretty=format:"- %s (%h)" --no-merges
            else
              git log "$TAG" --pretty=format:"- %s (%h)" --no-merges
            fi
            echo
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]{2}[.][0-9]{2}[.][0-9]{2}(-[1-9][0-9]*)?$ ]] || exit 1

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
