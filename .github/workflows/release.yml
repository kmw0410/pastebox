name: Release

on:
  workflow_run:
    workflows:
      - Docker Publish
    types:
      - completed
  workflow_dispatch:

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          git fetch --tags --force

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$(git tag --sort=-v:refname | grep '^v' | head -n 1)"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            TAG="$(git tag --points-at "$SHA" | grep '^v' | sort -V | tail -n 1)"
          fi

          if [ -z "$TAG" ]; then
            echo "No release tag found." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          REPO="${GITHUB_REPOSITORY,,}"
          IMAGE="ghcr.io/${REPO}"

          {
            echo "## Container Images"
            echo
            echo "- \`${IMAGE}:latest\`"
            echo "- \`${IMAGE}:${TAG}\`"
            echo
            echo "## Supported Platforms"
            echo
            echo "- linux/amd64"
            echo "- linux/arm64"
            echo
            echo "## Changes"
            echo
            PREVIOUS_TAG="$(git tag --sort=-v:refname | grep '^v' | grep -vx "$TAG" | head -n 1)"
            if [ -n "$PREVIOUS_TAG" ]; then
              git log "${PREVIOUS_TAG}..${TAG}" --pretty=format:"- %s (%h)" --no-merges
            else
              git log "$TAG" --pretty=format:"- %s (%h)" --no-merges
            fi
            echo
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
