services:
  pastebox:
    image: ghcr.io/kmw0410/pastebox:latest
    container_name: pastebox
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Optional. Set this only if you want to override Alpine repositories inside the container.
      # Example: "https://example-mirror.com/alpine"
      MIRROR_URL: "https://mirror5.krfoss.org/alpine"
      # The default time zone is Asia/Seoul (GMT +9). Change it as needed.
      # TZ: "Asia/Seoul"
      LANGUAGE: "en" # value: ko/en
      # Default admin reset token. Change this value before production use.
      ADMIN_RESET_TOKEN: "41345bfc5d9ab9e6e4c8d2e1b90e129af9cc472286954beeddb51c9b2beaf1d5b4eb3f10ae872ba1db4ef7e3f6fe1b474cdbe3aeeee9323a5b9ca99edf224883"
    volumes:
      - ./data:/paste-data
