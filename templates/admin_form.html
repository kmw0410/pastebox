<!doctype html>
<html lang="{{ t "_lang" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} - Pastebox</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <main class="page-shell auth-shell">
    <div class="panel narrow-panel auth-card">
      <p class="badge-muted">{{ t "brand_admin" }}</p>
      <h1 class="title small">{{ .Title }}</h1>
      <p class="description">{{ .Description }}</p>

      {{ if .Error }}
      <div class="alert error mt-md">{{ .Error }}</div>
      {{ end }}

      <form class="form" method="post" action="{{ .Action }}">
        <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
        <div class="form-field">
          <label>{{ t "admin_username" }}</label>
          <input class="input" name="username" autocomplete="username" required>
        </div>
        <div class="form-field">
          <label>{{ t "admin_password" }}</label>
          <input class="input" name="password" type="password" autocomplete="current-password" required>
        </div>
        {{ if .RequireSetupToken }}
        <div class="form-field">
          <label>{{ t "admin_setup_token" }}</label>
          <input class="input" name="setup_token" type="password" autocomplete="off" placeholder="{{ t "admin_setup_token_placeholder" }}" required>
        </div>
        {{ end }}
        <button class="button primary full" type="submit">{{ .Button }}</button>
      </form>
    </div>
  </main>
</body>
</html>
