<!doctype html>
<html lang="{{ t "_lang" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t "password_page_title" }} - Pastebox</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="dark min-h-screen bg-[#111111] text-[#E4E4E4]">
  <main class="mx-auto flex min-h-screen w-full max-w-[98rem] items-center justify-center px-6 py-14 md:px-12 md:py-20">
    <div class="w-full max-w-md rounded-3xl bg-[#111111] p-8 shadow-[0_18px_60px_rgba(0,0,0,0.45)] md:p-12">
      <p class="mb-3 inline-flex rounded-full border border-white/20 px-3 py-1 text-xs text-[#A8DADC]">{{ t "password_badge" }}</p>
      <h1 class="text-3xl font-bold tracking-tight text-[#E4E4E4]">{{ t "password_required_title" }}</h1>
      <p class="mt-3 text-sm leading-6 text-[#E4E4E4]/70">{{ t "password_required_desc" }}</p>

      <form class="mt-6 space-y-4" method="get" action="{{ .Action }}">
        <div>
          <label class="mb-2 block text-sm text-[#E4E4E4]/70" for="password">{{ t "password_label" }}</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            class="w-full rounded-xl border border-white/10 bg-[#1a1a1a] px-4 py-3 text-[#E4E4E4] outline-none transition placeholder:text-[#E4E4E4]/40 focus:border-[#A8DADC]/50"
            placeholder="{{ t "password_placeholder" }}"
            required
          >
        </div>

        <button class="w-full rounded-xl bg-[#B39CD0] px-4 py-3 font-semibold text-[#111111] transition hover:brightness-110" type="submit">{{ t "password_open_paste" }}</button>
      </form>

      <div class="mt-5 flex justify-center">
        <a class="text-sm text-[#E4E4E4]/55 transition hover:text-[#FFC1CC]" href="/">{{ t "back_to_home" }}</a>
      </div>
    </div>
  </main>
</body>
</html>
