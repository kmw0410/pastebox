<!doctype html>
<html lang="{{ t "_lang" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t "password_page_title" }} - Pastebox</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <main class="page-shell centered auth-shell">
    <section class="panel narrow-panel auth-card">
      <p class="badge">{{ t "password_badge" }}</p>
      <h1 class="title small">{{ t "password_required_title" }}</h1>
      <p class="description">{{ t "password_required_desc" }}</p>

      <form class="form" method="{{ .Method }}" action="{{ .Action }}">
        <div class="form-field">
          <label for="password">{{ t "password_label" }}</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            class="input"
            placeholder="{{ t "password_placeholder" }}"
            required
          >
        </div>

        <button class="button primary full" type="submit">{{ .SubmitLabel }}</button>
      </form>

      <div class="button-row center mt-md">
        <a class="button" href="/">{{ t "back_to_home" }}</a>
      </div>
    </section>
  </main>
</body>
</html>
