<!doctype html>
<html lang="{{ t "_lang" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t "password_page_title" }} - Pastebox</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#111111] text-zinc-100">
  <main class="mx-auto flex min-h-screen max-w-md items-center justify-center px-6 py-12">
    <div class="w-full rounded-3xl bg-[#111111] p-8 shadow-[0_18px_60px_rgba(0,0,0,0.45)] md:p-12">
      <p class="mb-3 inline-flex rounded-full border border-white/10 px-3 py-1 text-xs text-zinc-400">{{ t "password_badge" }}</p>
      <h1 class="text-3xl font-bold tracking-tight text-white">{{ t "password_required_title" }}</h1>
      <p class="mt-3 text-sm leading-6 text-zinc-400">{{ t "password_required_desc" }}</p>

      <form class="mt-6 space-y-4" method="get" action="{{ .Action }}">
        <div>
          <label class="mb-2 block text-sm text-zinc-400" for="password">{{ t "password_label" }}</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            class="w-full rounded-xl border border-white/10 bg-black/30 px-4 py-3 text-zinc-100 outline-none transition placeholder:text-zinc-600 focus:border-white/30"
            placeholder="{{ t "password_placeholder" }}"
            required
          >
        </div>

        <button class="w-full rounded-xl bg-zinc-100 px-4 py-3 font-semibold text-zinc-950 transition hover:bg-white" type="submit">{{ t "password_open_paste" }}</button>
      </form>

      <div class="mt-5 flex justify-center">
        <a class="text-sm text-zinc-500 transition hover:text-zinc-300" href="/">{{ t "back_to_home" }}</a>
      </div>
    </div>
  </main>
</body>
</html>
