<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .ID }} - Pastebox</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/paste.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/dockerfile.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/gitignore.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/ini.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/lua.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/makefile.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/nginx.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/sql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/toml.min.js"></script>
</head>
<body class="paste-page">
  <header class="paste-header">
    <div class="paste-header-inner">
      <div class="paste-meta">
        <p class="paste-brand">Pastebox</p>
        <span class="paste-dot"></span>
        <h1 class="paste-title">{{ .ID }}</h1>
        {{ if .Filename }}
        <span class="paste-filename">{{ .Filename }}</span>
        {{ end }}
        <span class="paste-badge">{{ .Language }}</span>
        <span id="longLineHint" class="paste-badge warning is-hidden">Long line detected</span>
      </div>

      <div class="paste-actions">
        <button
          id="copyButton"
          type="button"
          class="paste-button"
          onclick="copyPasteContent()"
        >
          Copy
        </button>
        <form method="post" action="/{{ .ID }}?clone=1">
          {{ if .Password }}
          <input type="hidden" name="password" value="{{ .Password }}">
          {{ end }}
          <button type="submit" class="paste-button green">Clone</button>
        </form>
        <button
          id="lineToggle"
          type="button"
          class="paste-button pinkish"
          onclick="toggleLineNumbers()"
          aria-pressed="false"
        >
          Lines
        </button>
        <button
          id="wrapToggle"
          type="button"
          class="paste-button gold"
          onclick="toggleWrapMode()"
          aria-pressed="false"
        >
          Wrap
        </button>
        <a class="paste-button violet" href="?format=raw">Raw</a>
      </div>
    </div>
  </header>

  <main class="paste-main">
    <div class="paste-scrollbar">
      <div id="viewer" class="paste-viewer">
        <pre id="lineNumbers" aria-hidden="true" class="is-hidden"></pre>
        <pre class="paste-code"><code id="pasteContent" class="language-{{ .Language }}">{{ .Content }}</code></pre>
      </div>
    </div>
  </main>

  <script>
    const viewer = document.getElementById("viewer");
    const lineNumbers = document.getElementById("lineNumbers");
    const lineToggle = document.getElementById("lineToggle");
    const wrapToggle = document.getElementById("wrapToggle");
    const longLineHint = document.getElementById("longLineHint");
    const pasteCode = document.querySelector(".paste-code");
    const pasteContent = document.getElementById("pasteContent");
    const rawText = pasteContent.textContent || "";
    const lines = rawText.split("\n");
    const longestLineLength = lines.reduce((max, line) => Math.max(max, line.length), 0);
    const longLineThreshold = 200;
    let wrapEnabled = false;

    function renderLineNumbers() {
      const lineCount = Math.max(1, lines.length);
      lineNumbers.textContent = Array.from({ length: lineCount }, (_, index) => index + 1).join("\n");
    }

    function setLineNumbersEnabled(enabled) {
      lineNumbers.classList.toggle("is-hidden", !enabled);
      viewer.classList.toggle("show-lines", enabled);
      lineToggle.classList.toggle("is-active", enabled);
      lineToggle.setAttribute("aria-pressed", enabled ? "true" : "false");
    }

    function toggleLineNumbers() {
      if (wrapEnabled) {
        return;
      }

      const enabled = lineNumbers.classList.contains("is-hidden");
      setLineNumbersEnabled(enabled);
    }

    function toggleWrapMode() {
      wrapEnabled = !wrapEnabled;

      viewer.classList.toggle("wrapped", wrapEnabled);
      pasteCode.classList.toggle("wrap-long-lines", wrapEnabled);
      wrapToggle.classList.toggle("is-active", wrapEnabled);
      wrapToggle.setAttribute("aria-pressed", wrapEnabled ? "true" : "false");

      if (wrapEnabled) {
        setLineNumbersEnabled(false);
        lineToggle.classList.add("is-disabled");
        lineNumbers.classList.add("lines-disabled");
        lineToggle.setAttribute("title", "Line numbers are disabled while wrap mode is on");
      } else {
        lineToggle.classList.remove("is-disabled");
        lineNumbers.classList.remove("lines-disabled");
        lineToggle.removeAttribute("title");
      }
    }

    renderLineNumbers();

    if (longestLineLength >= longLineThreshold) {
      longLineHint.classList.remove("is-hidden");
      wrapToggle.classList.add("long-line");
      wrapToggle.setAttribute("title", "Wrap very long lines for easier reading");
    }

    if (window.hljs && "{{ .Language }}" !== "logs") {
      hljs.highlightElement(pasteContent);
    }

    async function copyPasteContent() {
      const button = document.getElementById("copyButton");
      const content = rawText;

      try {
        await navigator.clipboard.writeText(content);
        button.innerText = "Copied";
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = content;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        button.innerText = "Copied";
      }

      setTimeout(() => {
        button.innerText = "Copy";
      }, 1500);
    }
  </script>
</body>
</html>
