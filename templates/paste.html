<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .OGTitle }}</title>
  <meta property="og:site_name" content="Pastebox">
  <meta property="og:title" content="{{ .OGTitle }}">
  <meta property="og:description" content="{{ .OGDescription }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ .PublicURL }}">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/paste.css">
  <script defer src="/js/highlight.min.js?v=11.11.1"></script>
  <script defer src="/js/dockerfile.min.js?v=11.11.1"></script>
  <script defer src="/js/nginx.min.js?v=11.11.1"></script>
  <script defer src="/js/kdl.min.js?v=1"></script>
</head>
<body class="paste-page">
  <header class="paste-header">
    <div class="paste-header-inner">
      <div class="paste-meta">
        <p class="paste-brand">Pastebox</p>
        <span class="paste-dot"></span>
        <h1 class="paste-title">{{ .ID }}</h1>
        {{ if .Filename }}
        <span class="paste-filename">{{ .Filename }}</span>
        {{ end }}
        {{ if .Label }}
        <span class="paste-filename">{{ .Label }}</span>
        {{ end }}
        <span class="paste-badge">{{ .Language }}</span>
        <span id="longLineHint" class="paste-badge warning is-hidden">Long line detected</span>
      </div>

      <div class="paste-actions">
        {{ if .Truncated }}
        <button
          id="loadFullButton"
          type="button"
          class="paste-button cyan"
          onclick="loadFullPaste()"
        >
          {{ t "paste_load_full" }}
        </button>
        {{ end }}
        <button
          id="copyButton"
          type="button"
          class="paste-button"
          onclick="copyPasteContent()"
        >
          Copy
        </button>
        <form method="post" action="/{{ .ID }}?clone=1">
          {{ if .Password }}
          <input type="hidden" name="password" value="{{ .Password }}">
          {{ end }}
          <button type="submit" class="paste-button green">Clone</button>
        </form>
        <button
          id="lineToggle"
          type="button"
          class="paste-button pinkish"
          onclick="toggleLineNumbers()"
          aria-pressed="false"
        >
          Lines
        </button>
        <button
          id="wrapToggle"
          type="button"
          class="paste-button gold"
          onclick="toggleWrapMode()"
          aria-pressed="false"
        >
          Wrap
        </button>
        <a class="paste-button violet" href="?format=raw">Raw</a>
      </div>
    </div>
  </header>

  <main class="paste-main">
    <div class="paste-scrollbar">
      <div id="viewer" class="paste-viewer">
        <pre id="lineNumbers" aria-hidden="true" class="is-hidden"></pre>
        <pre class="paste-code"><code id="pasteContent" class="language-{{ .Language }}">{{ .Content }}</code></pre>
      </div>
      {{ if .Truncated }}
      <template id="remainingPasteContent">{{ .Remaining }}</template>
      {{ end }}
    </div>
  </main>

  <script>
    const viewer = document.getElementById("viewer");
    const lineNumbers = document.getElementById("lineNumbers");
    const lineToggle = document.getElementById("lineToggle");
    const wrapToggle = document.getElementById("wrapToggle");
    const longLineHint = document.getElementById("longLineHint");
    const pasteCode = document.querySelector(".paste-code");
    const pasteContent = document.getElementById("pasteContent");
    const pasteLanguage = "{{ .Language }}";
    const pastePassword = {{ .Password }};
    let rawText = pasteContent.textContent || "";
    let lines = rawText.split("\n");
    let longestLineLength = lines.reduce((max, line) => Math.max(max, line.length), 0);
    const longLineThreshold = 200;
    const maxHighlightedLineLength = 10000;
    const renderBatchLines = 400;
    let wrapEnabled = false;

    function canHighlight() {
      return window.hljs && pasteLanguage !== "logs" && longestLineLength <= maxHighlightedLineLength && hljs.getLanguage(pasteLanguage);
    }

    function updateLongLineState() {
      if (longestLineLength < longLineThreshold) {
        return;
      }

      longLineHint.classList.remove("is-hidden");
      wrapToggle.classList.add("long-line");
      wrapToggle.setAttribute("title", "Wrap very long lines for easier reading");
    }

    async function renderFullPaste(content) {
      rawText = content;
      lines = rawText.split("\n");
      longestLineLength = lines.reduce((max, line) => Math.max(max, line.length), 0);
      pasteContent.textContent = "";

      for (let start = 0; start < lines.length; start += renderBatchLines) {
        const end = Math.min(start + renderBatchLines, lines.length);
        let chunk = lines.slice(start, end).join("\n");
        if (end < lines.length) {
          chunk += "\n";
        }

        if (canHighlight()) {
          const highlighted = hljs.highlight(chunk, { language: pasteLanguage, ignoreIllegals: true });
          pasteContent.insertAdjacentHTML("beforeend", highlighted.value);
        } else {
          pasteContent.appendChild(document.createTextNode(chunk));
        }

        await new Promise(window.requestAnimationFrame);
      }

      if (!lineNumbers.classList.contains("is-hidden")) {
        renderLineNumbers();
      } else {
        lineNumbers.textContent = "";
      }
      updateLongLineState();
    }

    async function loadFullPaste() {
      if (!window.confirm({{ t "paste_load_full_confirm" }})) {
        return;
      }

      const remaining = document.getElementById("remainingPasteContent");
      const button = document.getElementById("loadFullButton");
      button.disabled = true;
      button.innerText = {{ t "paste_loading_full" }};

      try {
        let fullContent;
        if (remaining) {
          fullContent = rawText + (remaining.content.textContent || "");
          remaining.remove();
        } else {
          const rawURL = new URL(window.location.href);
          rawURL.searchParams.set("format", "raw");
          rawURL.searchParams.delete("raw");
          const headers = pastePassword ? { "paste-password": pastePassword } : {};
          const response = await fetch(rawURL, { headers, credentials: "same-origin" });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          fullContent = await response.text();
        }

        await renderFullPaste(fullContent);
        button.remove();
      } catch (error) {
        button.disabled = false;
        button.innerText = {{ t "paste_load_full" }};
        window.alert({{ t "paste_load_full_error" }});
      }
    }

    function renderLineNumbers() {
      const lineCount = Math.max(1, lines.length);
      lineNumbers.textContent = Array.from({ length: lineCount }, (_, index) => index + 1).join("\n");
    }

    function setLineNumbersEnabled(enabled) {
      lineNumbers.classList.toggle("is-hidden", !enabled);
      viewer.classList.toggle("show-lines", enabled);
      lineToggle.classList.toggle("is-active", enabled);
      lineToggle.setAttribute("aria-pressed", enabled ? "true" : "false");
    }

    function toggleLineNumbers() {
      if (wrapEnabled) {
        return;
      }

      const enabled = lineNumbers.classList.contains("is-hidden");
      if (enabled) {
        renderLineNumbers();
      }
      setLineNumbersEnabled(enabled);
    }

    function toggleWrapMode() {
      wrapEnabled = !wrapEnabled;

      viewer.classList.toggle("wrapped", wrapEnabled);
      pasteCode.classList.toggle("wrap-long-lines", wrapEnabled);
      wrapToggle.classList.toggle("is-active", wrapEnabled);
      wrapToggle.setAttribute("aria-pressed", wrapEnabled ? "true" : "false");

      if (wrapEnabled) {
        setLineNumbersEnabled(false);
        lineToggle.classList.add("is-disabled");
        lineNumbers.classList.add("lines-disabled");
        lineToggle.setAttribute("title", "Line numbers are disabled while wrap mode is on");
      } else {
        lineToggle.classList.remove("is-disabled");
        lineNumbers.classList.remove("lines-disabled");
        lineToggle.removeAttribute("title");
      }
    }

    renderLineNumbers();
    updateLongLineState();
    window.addEventListener("DOMContentLoaded", () => {
      if (canHighlight()) {
        hljs.highlightElement(pasteContent);
      }
    });

    async function copyPasteContent() {
      const button = document.getElementById("copyButton");
      const content = rawText;

      try {
        await navigator.clipboard.writeText(content);
        button.innerText = "Copied";
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = content;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        button.innerText = "Copied";
      }

      setTimeout(() => {
        button.innerText = "Copy";
      }, 1500);
    }
  </script>
</body>
</html>
